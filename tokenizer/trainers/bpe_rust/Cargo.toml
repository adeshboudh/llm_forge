[package]
name        = "bpe-trainer"
version     = "0.1.0"
edition     = "2021"
description = "Fast Rust BPE tokenizer trainer — llm-forge Phase 1"
authors     = ["llm-forge"]

[[bin]]
name = "bpe-trainer"
path = "src/main.rs"

[dependencies]
# GPT-2 regex needs fancy-regex for negative lookahead (?!\S)
fancy-regex = "0.13"

# JSON serialization (tokenizer.json output)
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Data parallelism — count_pairs and apply_merge across all cores
rayon = "1.10"

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
panic          = "abort"
